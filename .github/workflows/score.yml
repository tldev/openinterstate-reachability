name: Reachability Scoring Pipeline

on:
  repository_dispatch:
    types: [oi-release]
  workflow_dispatch:
    inputs:
      oi_release_tag:
        description: "OpenInterstate release tag (optional, uses latest if empty)"
        required: false
        type: string

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  S3_BUCKET: pike-reachability-staging-${{ secrets.AWS_ACCOUNT_ID }}
  JOB_QUEUE_ONDEMAND: pike-reachability-queue-ondemand
  JOB_QUEUE_SPOT: pike-reachability-queue-spot
  JOB_DEF_OSM_BUILD: pike-reachability-osm-build
  JOB_DEF_SCORE: pike-reachability-score

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 960  # 16 hours
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine pipeline run ID
        id: run-id
        run: |
          PIPELINE_RUN_ID="${{ github.run_id }}-${GITHUB_RUN_ATTEMPT}"
          echo "id=${PIPELINE_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Pipeline run ID: ${PIPELINE_RUN_ID}"
          echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Resolve OI release tag
        id: oi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OI_TAG="${{ github.event.client_payload.release_tag }}"
          if [[ -z "$OI_TAG" ]]; then
            OI_TAG="${{ inputs.oi_release_tag }}"
          fi
          if [[ -z "$OI_TAG" ]]; then
            OI_TAG=$(gh release view --repo tldev/openinterstate --json tagName -q '.tagName' 2>/dev/null || echo "latest")
          fi
          echo "tag=${OI_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved OI release tag: ${OI_TAG}"

      - name: Determine availability zone
        id: az
        run: |
          # Pick the first subnet's AZ from the Batch compute environment
          AZ=$(aws ec2 describe-subnets \
            --filters "Name=tag:project,Values=pike-reachability" \
            --query 'Subnets[0].AvailabilityZone' \
            --output text \
            --region "$AWS_REGION" 2>/dev/null || echo "")
          if [[ -z "$AZ" || "$AZ" == "None" ]]; then
            # Fallback: use first available AZ in the region
            AZ=$(aws ec2 describe-availability-zones \
              --region "$AWS_REGION" \
              --query 'AvailabilityZones[0].ZoneName' \
              --output text)
          fi
          echo "az=${AZ}" >> "$GITHUB_OUTPUT"
          echo "Using AZ: ${AZ}"

      # ─── Create EBS Volume ─────────────────────────────────────
      - name: Create ephemeral EBS volume
        id: ebs
        run: |
          VOLUME_ID=$(bash scripts/create-ebs.sh \
            "${{ steps.az.outputs.az }}" \
            "${{ steps.run-id.outputs.id }}")
          echo "volume_id=${VOLUME_ID}" >> "$GITHUB_OUTPUT"

      # ─── osm-build Job ─────────────────────────────────────────
      - name: Submit osm-build Batch job
        id: osm-build
        run: |
          JOB_ID=$(S3_BUCKET="${S3_BUCKET}" bash scripts/submit-batch-job.sh \
            "$JOB_DEF_OSM_BUILD" \
            "$JOB_QUEUE_ONDEMAND" \
            "${{ steps.ebs.outputs.volume_id }}" \
            "${{ steps.run-id.outputs.id }}")
          echo "job_id=${JOB_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for osm-build to complete
        run: |
          JOB_ID="${{ steps.osm-build.outputs.job_id }}"
          MAX_ATTEMPTS=480  # 8 hours at 60s intervals
          ATTEMPT=0
          echo "Polling osm-build job ${JOB_ID} (max ${MAX_ATTEMPTS} attempts)..."
          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            STATUS=$(aws batch describe-jobs \
              --jobs "$JOB_ID" \
              --region "$AWS_REGION" \
              --query 'jobs[0].status' \
              --output text)
            echo "[$(date -u +%FT%TZ)] osm-build status: ${STATUS} (attempt ${ATTEMPT}/${MAX_ATTEMPTS})"
            case "$STATUS" in
              SUCCEEDED)
                echo "osm-build completed successfully"
                break
                ;;
              FAILED)
                REASON=$(aws batch describe-jobs \
                  --jobs "$JOB_ID" \
                  --region "$AWS_REGION" \
                  --query 'jobs[0].statusReason' \
                  --output text)
                echo "::error::osm-build FAILED: ${REASON}"
                exit 1
                ;;
              *)
                if [[ $ATTEMPT -ge $MAX_ATTEMPTS ]]; then
                  echo "::error::osm-build stuck in ${STATUS} after ${ATTEMPT} attempts ($(( ATTEMPT / 60 )) hours)"
                  exit 1
                fi
                sleep 60
                ;;
            esac
          done

      # ─── Score Job ─────────────────────────────────────────────
      - name: Submit score Batch job
        id: score
        run: |
          JOB_ID=$(S3_BUCKET="${S3_BUCKET}" \
            OI_RELEASE_TAG="${{ steps.oi.outputs.tag }}" \
            bash scripts/submit-batch-job.sh \
            "$JOB_DEF_SCORE" \
            "$JOB_QUEUE_SPOT" \
            "${{ steps.ebs.outputs.volume_id }}" \
            "${{ steps.run-id.outputs.id }}")
          echo "job_id=${JOB_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for score to complete
        run: |
          JOB_ID="${{ steps.score.outputs.job_id }}"
          MAX_ATTEMPTS=360  # 6 hours at 60s intervals
          ATTEMPT=0
          echo "Polling score job ${JOB_ID} (max ${MAX_ATTEMPTS} attempts)..."
          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            STATUS=$(aws batch describe-jobs \
              --jobs "$JOB_ID" \
              --region "$AWS_REGION" \
              --query 'jobs[0].status' \
              --output text)
            echo "[$(date -u +%FT%TZ)] score status: ${STATUS} (attempt ${ATTEMPT}/${MAX_ATTEMPTS})"
            case "$STATUS" in
              SUCCEEDED)
                echo "Scoring completed successfully"
                break
                ;;
              FAILED)
                REASON=$(aws batch describe-jobs \
                  --jobs "$JOB_ID" \
                  --region "$AWS_REGION" \
                  --query 'jobs[0].statusReason' \
                  --output text)
                echo "::error::score FAILED: ${REASON}"
                exit 1
                ;;
              *)
                if [[ $ATTEMPT -ge $MAX_ATTEMPTS ]]; then
                  echo "::error::score stuck in ${STATUS} after ${ATTEMPT} attempts ($(( ATTEMPT / 60 )) hours)"
                  exit 1
                fi
                sleep 60
                ;;
            esac
          done

      # ─── Download Output from S3 ───────────────────────────────
      - name: Download scoring output from S3
        run: |
          S3_PREFIX="s3://${S3_BUCKET}/${{ steps.run-id.outputs.id }}"
          mkdir -p output
          aws s3 cp "${S3_PREFIX}/reachability.csv" output/reachability.csv \
            --region "$AWS_REGION"
          aws s3 cp "${S3_PREFIX}/osrm_snap_hints.csv" output/osrm_snap_hints.csv \
            --region "$AWS_REGION" 2>/dev/null || echo "No snap hints file (OK)"
          echo "Downloaded files:"
          ls -lh output/
          ROW_COUNT=$(tail -n +2 output/reachability.csv | wc -l)
          echo "Reachability CSV: ${ROW_COUNT} data rows"

      # ─── Create GitHub Release ─────────────────────────────────
      - name: Create GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="score-$(date -u +%Y%m%d)-${SHORT_SHA}"
          ROW_COUNT=$(tail -n +2 output/reachability.csv | wc -l)
          FILE_SIZE=$(du -h output/reachability.csv | cut -f1)
          ELAPSED=$(( $(date +%s) - ${{ steps.run-id.outputs.start_time }} ))
          DURATION="$(( ELAPSED / 3600 ))h $(( (ELAPSED % 3600) / 60 ))m"

          ASSETS=(output/reachability.csv)
          SNAP_NOTE=""
          if [[ -f output/osrm_snap_hints.csv ]]; then
            ASSETS+=(output/osrm_snap_hints.csv)
            SNAP_NOTE="- **Snap hints:** included (for incremental scoring)"
          fi

          RELEASE_BODY=$(cat <<EOF
          ## Reachability Scoring Run

          - **OI release:** ${{ steps.oi.outputs.tag }}
          - **Rows:** ${ROW_COUNT}
          - **File size:** ${FILE_SIZE}
          - **Duration:** ${DURATION}
          - **Pipeline run:** ${{ steps.run-id.outputs.id }}
          - **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ${SNAP_NOTE}
          EOF
          )
          # Strip leading whitespace from indented heredoc
          RELEASE_BODY=$(echo "$RELEASE_BODY" | sed 's/^          //')

          gh release create "$TAG" \
            --title "Reachability ${TAG}" \
            --notes "$RELEASE_BODY" \
            "${ASSETS[@]}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Created release: ${TAG}"

      # ─── Delete EBS Volume ─────────────────────────────────────
      - name: Delete EBS volume
        if: always()
        run: |
          VOLUME_ID="${{ steps.ebs.outputs.volume_id }}"
          if [[ -n "$VOLUME_ID" ]]; then
            bash scripts/delete-ebs.sh "$VOLUME_ID" || echo "::warning::EBS cleanup failed for ${VOLUME_ID}"
          fi

      # ─── Dispatch to Pike ─────────────────────────────────────
      - name: Dispatch to pike repo
        if: success()
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          gh api repos/tldev/pike/dispatches \
            -f event_type=reachability-release \
            -f "client_payload[release_tag]=${{ steps.release.outputs.tag }}"
